[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/<user>/uav-geo-backend"

[workspace.dependencies]
# Internal crates
geo-core = { path = "crates/geo-core" }
telemetry = { path = "crates/telemetry" }

# External crates are added here as the project grows (week 2+), e.g.:
# tokio = { version = "1", features = ["full"] }
# axum = "0.8"
# mavlink = "0.13"
# sqlx = { version = "0.8", features = ["runtime-tokio", "postgres"] }
# thiserror = "2"
# tracing = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

[profile.release]
lto = "thin"
