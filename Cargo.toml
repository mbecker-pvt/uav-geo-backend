[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/mbecker-pvt/uav-geo-backend"

[workspace.dependencies]
# Internal crates
geo-core = { path = "crates/geo-core" }
telemetry = { path = "crates/telemetry" }

terrain = { path = "crates/terrain" }
storage = { path = "crates/storage" }

# External crates
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
geo = "0.33.1"
geojson = "1.0.0"
mavlink = { version = "0.21.0", default-features = false, features = ["std", "dialect-common", "transport-udp", "tokio"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "uuid", "migrate", "macros"] }
thiserror = "2.0.21"
tiff = "0.11.3"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
tokio-util = "0.7.20"
tower-http = { version = "0.7.1", features = ["trace", "cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.3", features = ["v4", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

[profile.release]
lto = "thin"
