[package]
name = "server"
description = "HTTP/WebSocket API, ingestion pipeline and binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "uav-geo-backend"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
geo-core.workspace = true
storage.workspace = true
telemetry.workspace = true
terrain.workspace = true
anyhow.workspace = true
axum.workspace = true
chrono.workspace = true
futures-util.workspace = true
geojson.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[lints]
workspace = true

[features]
# End-to-end tests against PostGIS; need DATABASE_URL (see docker-compose.yml).
db-tests = []

[dev-dependencies]
mavlink.workspace = true
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
tiff.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite = "0.30.0"
